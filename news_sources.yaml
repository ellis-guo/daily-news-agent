# 新闻自动收集配置文件
# 路径: ~/.hermes/news_sources.yaml
# 修改此文件即可增删信息源，无需改代码

# ============================================================
# 一、热点（TrendRadar SQLite，0 token）
# ============================================================
trends:
  enabled: true
  db_path: ~/TrendRadar/output/news  # 自动读取今日 .db 文件
  platforms:
    - weibo
    - zhihu
    - baidu
    - toutiao
    - wallstreetcn-hot
  max_items: 15

# ============================================================
# 二、新闻
# ============================================================
news:
  # 财新（cookie 鉴权，存于 ~/.hermes/.env CAIXIN_COOKIE）
  - id: caixin
    name: 财新
    type: scrape
    url: https://www.caixin.com
    cookie_env: CAIXIN_COOKIE
    max_items: 8

  # 公众号（WeWe RSS 自建实例）
  - id: szsmkzk
    name: 数字生命卡兹克
    type: rss
    url: http://192.9.158.168:4000/feeds/MP_WXS_3223096120.atom
    max_items: 3

  - id: gududanao
    name: 孤独大脑
    type: rss
    url: http://192.9.158.168:4000/feeds/MP_WXS_2398022876.atom
    max_items: 3

  - id: baoyuai
    name: 宝玉AI
    type: rss
    url: http://192.9.158.168:4000/feeds/MP_WXS_3957812448.atom
    max_items: 3

